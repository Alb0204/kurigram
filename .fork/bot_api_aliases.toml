InlineQueryResultGif = "InlineQueryResultAnimation"
InlineQueryResultCachedGif = "InlineQueryResultCachedAnimation"

[types.not_applicable]
Update = "updates are dispatched to handlers, not returned as one object"
WebhookInfo = "no webhooks over MTProto"
ResponseParameters = "Bot API HTTP error fields; MTProto errors are exceptions"
InputFile = "file arguments take a path, a URL, a file_id or a binary stream"
MessageId = "copy and forward methods return the `Message` itself"

[types.different_shape]
ChatFullInfo = "get_chat returns a `Chat` carrying the full information"
